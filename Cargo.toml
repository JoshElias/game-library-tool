[package]
name = "game-library"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Host-targeted Lutris and Ludusavi game-library operator"
readme = "README.md"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
minijinja = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
